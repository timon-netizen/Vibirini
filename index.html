<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВИБИРИНИ — Мемный Мессенджер</title>
    <style>
        :root {
            --bg-deep: #0b0714;
            --bg-panel: #140d24;
            --bg-hover: #1f1438;
            --purple-neon: #a259ff;
            --purple-glow: rgba(162, 89, 255, 0.4);
            --text-main: #f3f0ff;
            --text-muted: #9b8ebc;
            --accent-pink: #ff3399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(162, 89, 255, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 51, 153, 0.1) 0%, transparent 40%);
        }

        .sidebar {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid rgba(162, 89, 255, 0.15);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(162, 89, 255, 0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--purple-neon), var(--accent-pink));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 15px var(--purple-glow);
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, var(--purple-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text span {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 5px;
        }

        .chat-item:hover {
            background-color: var(--bg-hover);
        }

        .chat-item.active {
            background-color: rgba(162, 89, 255, 0.2);
            border: 1px solid rgba(162, 89, 255, 0.3);
            box-shadow: 0 0 10px rgba(162, 89, 255, 0.1);
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #2a1b4e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            position: relative;
        }

        .online-indicator {
            width: 12px;
            height: 12px;
            background-color: #00ffcc;
            border: 2px solid var(--bg-panel);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .chat-name {
            font-weight: 600;
            font-size: 14px;
        }

        .chat-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .chat-last-msg {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-deep);
        }

        .chat-header {
            padding: 15px 25px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid rgba(162, 89, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .current-chat-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--purple-neon), var(--accent-pink));
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--purple-glow);
            transition: transform 0.1s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-download:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 20px var(--purple-neon);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            background-color: var(--bg-panel);
            border: 1px solid rgba(162, 89, 255, 0.15);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.outgoing {
            background: linear-gradient(135deg, #7b2cbf, #a259ff);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.3);
        }

        .msg-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-align: right;
            margin-top: 4px;
        }

        .meme-img {
            max-width: 220px;
            border-radius: 10px;
            margin-top: 6px;
            display: block;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .chat-input-area {
            padding: 20px;
            background-color: var(--bg-panel);
            border-top: 1px solid rgba(162, 89, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .chat-input {
            width: 100%;
            background-color: var(--bg-deep);
            border: 1px solid rgba(162, 89, 255, 0.3);
            padding: 12px 45px 12px 16px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .chat-input:focus {
            border-color: var(--purple-neon);
            box-shadow: 0 0 10px var(--purple-glow);
        }

        .btn-meme-picker {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.2s;
        }

        .btn-meme-picker:hover {
            transform: scale(1.2);
        }

        .btn-send {
            background-color: var(--purple-neon);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 0 10px var(--purple-glow);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-send:hover {
            background-color: #b375ff;
            transform: scale(1.05);
        }

        .mascot-box {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--bg-panel);
            border: 2px solid var(--purple-neon);
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 0 25px var(--purple-glow);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;
            animation: floatMascot 4s ease-in-out infinite;
        }

        @keyframes floatMascot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .mascot-avatar {
            font-size: 32px;
        }

        .mascot-text h4 {
            font-size: 13px;
            color: var(--purple-neon);
            margin-bottom: 2px;
        }

        .mascot-text p {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-area">
                <div class="logo-icon">🔮</div>
                <div class="logo-text">
                    <h1>ВИБИРИНИ</h1>
                    <span>Meme Messenger</span>
                </div>
            </div>
        </div>

        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div class="current-chat-info">
                <div class="chat-avatar" id="currentAvatar">🤖</div>
                <div>
                    <div class="chat-name" id="currentName">Вибирин Бот</div>
                    <div class="chat-time" id="currentStatus">онлайн • раздает мемы</div>
                </div>
            </div>
            <div class="header-actions">
                <a href="#" class="btn-download" onclick="alert('Дистрибутив приложения для ПК находится в разработке! Скоро будет доступен .exe файл.')">
                    📥 Скачать ПК-версию
                </a>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" class="chat-input" id="messageInput" placeholder="Написать мем или сообщение..." autocomplete="off">
                <button class="btn-meme-picker" onclick="sendRandomMeme()" title="Отправить мем">🤡</button>
            </div>
            <button class="btn-send" onclick="sendMessage()">🚀</button>
        </div>
    </div>

    <div class="mascot-box">
        <div class="mascot-avatar">👾</div>
        <div class="mascot-text">
            <h4>Маскот Вибирин</h4>
            <p id="mascotQuote">«Врубаем неоновый вайб!»</p>
        </div>
    </div>

    <script>
        const chats = [
            {
                id: 1,
                name: 'Вибирин Бот',
                avatar: '🤖',
                status: 'онлайн • главный по мемам',
                messages: [
                    { sender: 'incoming', text: 'Здарова! Добро пожаловать в ВИБИРИНИ — самый неоновый мессенджер!', time: '12:00' },
                    { sender: 'incoming', text: 'Кидай сюда свои лучшие мемы или просто пообщайся со мной!', time: '12:01' }
                ]
            },
            {
                id: 2,
                name: 'Клан Котиков',
                avatar: '🐱',
                status: '3 участника онлайн',
                messages: [
                    { sender: 'incoming', text: 'У кого есть свежие картинки с программистами?', time: '11:45' },
                    { sender: 'incoming', text: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400', time: '11:50', isImage: true }
                ]
            }
        ];

        let activeChatId = 1;

        const quotes = [
            "«Врубаем неоновый вайб!»",
            "«Мемы — топливо для прогресса 🚀»",
            "«Фиолетовый цвет повышает FPS в чате!»",
            "«Кидай мем быстрее, братан!»"
        ];

        function renderChats() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const lastMsg = chat.messages[chat.messages.length - 1];
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                div.onclick = () => switchChat(chat.id);
                div.innerHTML = `
                    <div class="chat-avatar">
                        ${chat.avatar}
                        <div class="online-indicator"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-name-row">
                            <span class="chat-name">${chat.name}</span>
                            <span class="chat-time">${lastMsg ? lastMsg.time : ''}</span>
                        </div>
                        <div class="chat-last-msg">${lastMsg ? (lastMsg.isImage ? '[Картинка]' : lastMsg.text) : ''}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function switchChat(id) {
            activeChatId = id;
            renderChats();
            renderMessages();
            const chat = chats.find(c => c.id === id);
            document.getElementById('currentAvatar').innerText = chat.avatar;
            document.getElementById('currentName').innerText = chat.name;
            document.getElementById('currentStatus').innerText = chat.status;
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            const chat = chats.find(c => c.id === activeChatId);
            
            chat.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender}`;
                
                let content = `<div>${msg.text}</div>`;
                if (msg.isImage) {
                    content = `<img src="${msg.text}" class="meme-img">`;
                }

                div.innerHTML = `
                    ${content}
                    <div class="msg-time">${msg.time}</div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const chat = chats.find(c => c.id === activeChatId);

            chat.messages.push({ sender: 'outgoing', text, time });
            input.value = '';
            renderMessages();
            renderChats();

            setTimeout(() => {
                const botReplies = [
                    "Ха-ха, зачетный мем! 🔥",
                    "Принято в копилку ВИБИРИНИ!",
                    "Одобряю на все 100% 😎",
                    "Фиолетовая мощь в деле!"
                ];
                const replyText = botReplies[Math.floor(Math.random() * botReplies.length)];
                chat.messages.push({ sender: 'incoming', text: replyText, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
                renderMessages();
                renderChats();
            }, 1000);
        }

        function sendRandomMeme() {
            const memes = [
                "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400",
                "https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=400"
            ];
            const memeUrl = memes[Math.floor(Math.random() * memes.length)];
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const chat = chats.find(c => c.id === activeChatId);

            chat.messages.push({ sender: 'outgoing', text: memeUrl, time, isImage: true });
            renderMessages();
            renderChats();
        }

        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        setInterval(() => {
            const quote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('mascotQuote').innerText = quote;
        }, 5000);

        renderChats();
        renderMessages();
    </script>
</body>
</html>
